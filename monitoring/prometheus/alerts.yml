groups:
  - name: llmops
    rules:
      - alert: LLMOpsBackendDown
        expr: llmops_backend_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM backend {{ $labels.backend }} is not serving its configured model"
          description: >-
            The API cannot reach the backend or the configured model is not
            loaded. Check /health on the API and the backend logs.

      - alert: LLMOpsHighErrorRate
        expr: >-
          sum(rate(llmops_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(llmops_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLMOps API 5xx rate is above 5%"
          description: "More than 5% of requests returned a 5xx over the last 5 minutes."

      - alert: LLMOpsHighGenerationLatency
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le, backend) (
              rate(llmops_generation_duration_seconds_bucket[5m])
            )
          ) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 generation latency for {{ $labels.backend }} is above 30s"
          description: "Generation p95 has been above 30 seconds for 5 minutes."

      - alert: LLMOpsBackendQueueSaturated
        expr: llmops_inflight_requests >= 8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.backend }} has 8+ in-flight requests"
          description: >-
            Requests are queueing behind MAX_CONCURRENT_REQUESTS. Consider
            raising the limit or adding capacity.
