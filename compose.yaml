services:
  llmops-api:
    build:
      context: .
    image: llmops-api:0.2
    container_name: llmops-api
    network_mode: host
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      VLLM_URL: ${VLLM_URL:-http://127.0.0.1:8000}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: llmops-prometheus
    network_mode: host
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=127.0.0.1:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: llmops-grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-lab-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
